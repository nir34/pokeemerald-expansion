name: Build ROM

# 每次 push / PR / 手动 / 每周一次，在 GitHub 免费云端编译 pokeemerald.gba
on:
  push:
    branches: [master]
    paths-ignore:
      - 'pokeemerald.gba'      # 机器人提交 ROM 时不重复触发
  pull_request:
  workflow_dispatch:
    inputs:
      commit_rom:
        description: '构建完成后把 pokeemerald.gba 提交回本分支'
        type: boolean
        default: true
  schedule:
    - cron: '0 20 * * 0'       # 每周一 04:00 (UTC+8)

concurrency:
  group: build-rom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: make all (modern)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 60
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装宿主依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libpng-dev ca-certificates
          arm-none-eabi-gcc --version | head -1

      - name: 准备预生成文件（仓库未内置 poryscript）
        # data/*.inc 是仓库里的权威版本，但 Makefile 里有 data/%.inc: data/%.pory 规则。
        # 全新 clone 后 mtime 相同，make 会去调用不存在的 tools/poryscript/poryscript 而失败。
        run: |
          find data -name '*.inc'  -exec touch {} +
          find data -name '*.pory' -exec touch -d '2020-01-01 00:00:00' {} +

      - name: 编译
        run: |
          set -o pipefail
          make -j"$(nproc)" -O all 2>&1 | tee build.log

      - name: 构建失败摘要
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          msg=$(awk '{gsub(/%/,"%25"); gsub(/\r/,""); printf "%s%%0A", $0}' build.log | tail -c 3500)
          echo "::error title=make 失败::$msg"

      - name: 失败时把构建日志提交回分支
        if: failure()
        run: |
          set -euo pipefail
          [ -f build.log ] || exit 0
          branch="${{ github.head_ref || github.ref_name }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build.log ci-build.log
          git add -f ci-build.log
          git commit -m "ci: 构建失败日志 [skip ci]" || exit 0
          git push origin "HEAD:${branch}" || echo "::warning::token 无写权限，日志只保留在 artifact 里"

      - name: 校验 ROM
        run: |
          set -euo pipefail
          test -f pokeemerald.gba
          size=$(stat -c%s pokeemerald.gba)
          echo "ROM 大小: $size 字节"
          test "$size" = "33554432" || { echo "::error::ROM 大小异常"; exit 1; }
          title=$(dd if=pokeemerald.gba bs=1 skip=160 count=12 2>/dev/null | tr -d '\0')
          code=$(dd if=pokeemerald.gba bs=1 skip=172 count=4 2>/dev/null)
          echo "标题: ${title}"
          echo "代码: ${code}"
          test "$code" = "BPEE" || { echo "::error::游戏代码不是 BPEE"; exit 1; }
          sha1sum pokeemerald.gba | tee rom.sha1
          if git diff --quiet -- pokeemerald.gba; then
            echo "::notice::仓库里的 pokeemerald.gba 与本次构建一致"
          else
            echo "::warning::仓库里的 pokeemerald.gba 已过期（与本次构建不一致）"
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-${{ github.sha }}
          path: |
            pokeemerald.gba
            pokeemerald.map
            rom.sha1
            build.log
          retention-days: 30

      - name: 把新 ROM 提交回分支
        if: github.event_name == 'workflow_dispatch' && inputs.commit_rom
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokeemerald.gba
          if git diff --cached --quiet; then
            echo "ROM 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(rom): 云端构建 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  release:
    name: 发布 Release（打 tag 时）
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: pokeemerald-${{ github.sha }}

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pokeemerald.gba
            rom.sha1
