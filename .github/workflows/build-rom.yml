name: Build ROM

# 每次 push / PR / 手动 / 每周一次，在 GitHub 免费云端编译 pokeemerald.gba
on:
  push:
    branches: [master]
    paths-ignore:
      - 'pokeemerald.gba'      # 机器人提交 ROM 时不重复触发
  pull_request:
  workflow_dispatch:
    inputs:
      commit_rom:
        description: '构建完成后把 pokeemerald.gba 提交回本分支'
        type: boolean
        default: true
  schedule:
    - cron: '0 20 * * 0'       # 每周一 04:00 (UTC+8)

concurrency:
  group: build-rom-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: make all (modern)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    timeout-minutes: 60
    env:
      GAME_VERSION: EMERALD
      GAME_REVISION: 0
      GAME_LANGUAGE: ENGLISH
      UNUSED_ERROR: 0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装宿主依赖
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential libpng-dev ca-certificates
          arm-none-eabi-gcc --version | head -1

      - name: 准备预生成文件（仓库未内置 poryscript）
        # data/*.inc 是仓库里的权威版本，但 Makefile 里有 data/%.inc: data/%.pory 规则。
        # 全新 clone 后 mtime 相同，make 会去调用不存在的 tools/poryscript/poryscript 而失败。
        run: |
          find data -name '*.inc'  -exec touch {} +
          find data -name '*.pory' -exec touch -d '2020-01-01 00:00:00' {} +

      - name: 编译
        run: |
          set +e
          echo "shell: $0 | pwd: $(pwd)"
          which make gcc arm-none-eabi-gcc || true
          make -j"$(nproc)" -O all > build.log 2>&1
          rc=$?
          echo "make exit=$rc"
          tail -60 build.log
          exit $rc

      - name: 失败诊断（annotation + 评论 + 提交日志）
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          if [ -f pokeemerald.gba ]; then echo "构建成功，跳过诊断"; exit 0; fi
          if [ ! -f build.log ]; then
            echo "::error title=没有build.log::pwd=$(pwd) files=$(ls | tr '~' ' ' | tr '\n' ' ')"
            exit 0
          fi
          echo "build.log 大小: $(wc -c < build.log)"
          echo "=== build.log 尾部 ==="
          tail -25 build.log

          echo "--- 通道1: annotation ---"
          short=$(tail -15 build.log | tr -d '\r' | sed 's/%/%25/g' | tr '\n' '~' | cut -c1-1200)
          echo "::error title=make失败::$short"

          echo "--- 通道2: 提交日志到分支 ---"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build.log ci-build.log
          git add -f ci-build.log
          git commit -m "ci: 构建失败日志 [skip ci]" 2>&1 | tail -3
          echo "commit rc=$?"
          git push origin "HEAD:${BRANCH}" 2>&1 | tail -5
          echo "push rc=$?"

          echo "--- 通道3: PR 评论 ---"
          if [ -n "${PR_NUMBER}" ] && command -v jq >/dev/null; then
            tail -c 4000 build.log | jq -Rs '{body: ("构建失败日志（尾部）：\n\n```\n" + . + "\n```")}' \
              | curl -sS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments" -d @- | head -c 200
          fi

      - name: 校验 ROM
        run: |
          set -euo pipefail
          test -f pokeemerald.gba
          size=$(stat -c%s pokeemerald.gba)
          echo "ROM 大小: $size 字节"
          test "$size" = "33554432" || { echo "::error::ROM 大小异常"; exit 1; }
          title=$(dd if=pokeemerald.gba bs=1 skip=160 count=12 2>/dev/null | tr -d '\0')
          code=$(dd if=pokeemerald.gba bs=1 skip=172 count=4 2>/dev/null)
          echo "标题: ${title}"
          echo "代码: ${code}"
          test "$code" = "BPEE" || { echo "::error::游戏代码不是 BPEE"; exit 1; }
          sha1sum pokeemerald.gba | tee rom.sha1
          if git diff --quiet -- pokeemerald.gba; then
            echo "::notice::仓库里的 pokeemerald.gba 与本次构建一致"
          else
            echo "::warning::仓库里的 pokeemerald.gba 已过期（与本次构建不一致）"
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-${{ github.sha }}
          path: |
            pokeemerald.gba
            pokeemerald.map
            rom.sha1
            build.log
          retention-days: 30

      - name: 把新 ROM 提交回分支
        if: github.event_name == 'workflow_dispatch' && inputs.commit_rom
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokeemerald.gba
          if git diff --cached --quiet; then
            echo "ROM 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(rom): 云端构建 $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  release:
    name: 发布 Release（打 tag 时）
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          name: pokeemerald-${{ github.sha }}

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pokeemerald.gba
            rom.sha1
